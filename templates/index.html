{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Movie Listings</h2>
    <a href="{{ url_for('add_movie') }}" class="btn btn-primary">+ Add Movie</a>
</div>

<div class="row">
    {% for movie in movies %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <img src="{{ movie.poster_url }}" class="card-img-top" alt="Poster">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.genre }} | {{ movie.year }}</p>
                <a href="{{ url_for('movie_detail', id=movie.id) }}" class="btn btn-outline-primary btn-sm">View
                    Details</a>
                <a href="{{ url_for('edit_movie', id=movie.id) }}" class="btn btn-outline-warning btn-sm">Edit</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
