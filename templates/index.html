{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h2 class="me-3">Movie Listings</h2>
    
    <form method="GET" action="{{ url_for('search_movies') }}" class="d-flex flex-wrap me-3">
        <input type="text" name="query" class="form-control me-2 mb-2 mb-md-0" placeholder="Search by title..." required>
        <button class="btn btn-outline-secondary" type="submit">Search</button>
    </form>

    <a href="{{ url_for('add_movie') }}" class="btn btn-primary">+ Add Movie</a>
</div>

<div class="row">
    {% for movie in movies %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <img src="{{ movie.poster_url }}" class="card-img-top poster-img" alt="Poster">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p class="card-text">{{ movie.genre }} | {{ movie.year }}</p>
                <a href="{{ url_for('movie_detail', id=movie._id) }}" class="btn btn-outline-primary btn-sm">View Details</a>
                <a href="{{ url_for('edit_movie', id=movie._id) }}" class="btn btn-outline-warning btn-sm">Edit</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
