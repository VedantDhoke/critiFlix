{% extends "base.html" %}

{% block content %}
<h2>Edit Your Review for <span class="text-primary">{{ movie.title }}</span></h2>

<form method="POST">
    <div class="mb-3">
        <label>Review</label>
        <textarea name="content" class="form-control" rows="4" required>{{ review.content }}</textarea>
    </div>
    <button type="submit" class="btn btn-warning">Update Review</button>
</form>
{% endblock %}
